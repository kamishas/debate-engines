[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deliberation-engine"
version = "0.1.0"
description = "Bounded Proposer-Critic dialogue with an evidence-linked report"
requires-python = ">=3.11"
dependencies = ["anthropic>=1.11,<2", "pydantic>=2.10,<3", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
deliberate = "deliberation.cli:main"

[tool.setuptools.package-data]
deliberation = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
